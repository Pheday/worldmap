<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страны мира</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="bar">
    <div class="title">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      </span>
      <span data-t="appTitle">Страны мира</span>
    </div>
    <div class="stats">
      <div class="stat stat-progress" data-t-title="progressTitle" title="Отгадано">
        <span id="progress">0 из 0</span>
        <span class="meter"><i id="progressBar"></i></span>
      </div>
      <div class="stat" data-t-title="timeTitle" title="Время">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
        <span id="timer">00:00</span>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="dunnoBtn" class="ghost" disabled data-t="dunno">Не знаю</button>
      <button type="button" id="enoughBtn" class="ghost" disabled data-t="enough">Мне хватит</button>
      <span class="sep" aria-hidden="true"></span>
      <div class="lang" id="langPicker">
        <button type="button" id="langBtn" class="ghost" aria-haspopup="listbox" aria-expanded="false" data-t-title="langTitle" data-t-aria="langTitle" title="Язык" aria-label="Язык">
          <img id="langFlag" class="lang-flag" src="data/flags/RUS.png" alt="">
          <span id="langCode">RU</span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
        <ul id="langMenu" class="lang-menu" role="listbox" data-t-aria="langTitle" aria-label="Язык" hidden>
          <li role="option" data-lang="ru" data-code="RU" tabindex="-1"><img class="lang-flag" src="data/flags/RUS.png" alt="">Русский</li>
          <li role="option" data-lang="en" data-code="EN" tabindex="-1"><img class="lang-flag" src="data/flags/GBR.png" alt="">English</li>
          <li role="option" data-lang="zh" data-code="中文" tabindex="-1"><img class="lang-flag" src="data/flags/CHN.png" alt="">中文</li>
        </ul>
      </div>
      <button type="button" id="soundBtn" class="icon ghost" title="Звук включён" data-t-aria="sound" aria-label="Звук">
        <svg class="ico on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="ico off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button type="button" id="settingsBtn" class="icon ghost" data-t-title="settings" data-t-aria="settings" title="Настройки" aria-label="Настройки">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button type="button" id="menuBtn" class="primary" data-t-title="newGame" title="Новая игра">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-t="newGame">Новая игра</span>
      </button>
    </div>
  </header>

  <main class="map-wrap" id="mapWrap">
    <svg id="map" data-t-aria="map" aria-label="Карта мира"></svg>
    <div class="question" id="question" hidden>
      <span class="question-label" id="questionLabel"></span>
      <span class="question-value" id="questionValue"></span>
      <form class="answer" id="answer" hidden autocomplete="off">
        <div class="combo">
          <input type="text" id="answerInput" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="answerList" data-t-aria="capital" aria-label="Столица">
          <button type="button" id="answerToggle" class="combo-toggle" tabindex="-1" aria-expanded="false" aria-controls="answerList"
            data-t-title="allCapitals" data-t-aria="allCapitals" title="Все столицы" aria-label="Все столицы">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div id="answerHint" class="answer-hint" role="status" hidden></div>
          <ul id="answerList" class="combo-list" role="listbox" data-t-aria="allCapitals" aria-label="Все столицы" hidden></ul>
        </div>
        <button type="submit" class="primary" id="answerBtn" data-t="answerBtn">Ответить</button>
      </form>
    </div>
    <div class="zoom">
      <button type="button" id="zoomIn" data-t-aria="zoomIn" aria-label="Приблизить">+</button>
      <button type="button" id="zoomOut" data-t-aria="zoomOut" aria-label="Отдалить">−</button>
      <button type="button" id="zoomReset" data-t-aria="zoomReset" aria-label="Показать весь мир">⤢</button>
    </div>
    <div class="scale-bar" id="scaleBar" aria-hidden="true"><span id="scaleLabel"></span><i id="scaleLine"></i></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <div class="card" id="card" hidden role="dialog" data-t-aria="cardAria" aria-label="Сведения о стране">
    <button type="button" class="card-close" id="cardClose" data-t-aria="close" aria-label="Закрыть">×</button>
    <div class="card-verdict" id="cardVerdict"></div>
    <h2 class="card-name" id="cardName"></h2>
    <div class="card-images">
      <figure><img id="cardFlag" alt=""><figcaption data-t="flag">Флаг</figcaption></figure>
      <figure><img id="cardArms" alt=""><figcaption id="cardArmsCaption">Герб</figcaption></figure>
    </div>
    <dl class="card-facts" id="cardFacts"></dl>
    <p class="card-note" id="cardNote" hidden></p>
  </div>

  <div class="modal" id="startModal">
    <div class="modal-box">
      <button type="button" class="card-close" id="startClose" data-t-aria="close" data-t-title="close" aria-label="Закрыть" title="Закрыть" hidden>×</button>
      <h1 data-t="appTitle">Страны мира</h1>
      <p data-t="whatToGuess">Что будем угадывать?</p>
      <div class="modes">
        <label><input type="radio" name="mode" value="countries" checked> <b data-t="modeCountries">Страны</b><span data-t="modeCountriesHint">по названию</span></label>
        <label><input type="radio" name="mode" value="capitals"> <b data-t="modeCapitals">Столицы</b><span data-t="modeCapitalsHint">найти страну по столице</span></label>
        <label><input type="radio" name="mode" value="nameCapital"> <b data-t="modeNameCapital">Столицы</b><span data-t="modeNameCapitalHint">написать столицу по стране</span></label>
        <label><input type="radio" name="mode" value="flags"> <b data-t="modeFlags">Флаги</b><span data-t="modeFlagsHint">по флагу</span></label>
      </div>
      <button type="button" class="primary big" id="startBtn" data-t="go">Поехали!</button>
    </div>
  </div>

  <div class="modal" id="endModal" hidden>
    <div class="modal-box">
      <h1 id="endTitle">Игра окончена!</h1>
      <p class="end-score" id="endScore"></p>
      <ul class="end-stats" id="endStats"></ul>
      <div class="end-actions">
        <button type="button" class="primary big" id="againBtn" data-t="again">Ещё раз</button>
        <button type="button" id="inspectBtn" data-t="inspect">Осмотреть карту</button>
      </div>
    </div>
  </div>

  <div class="modal top" id="settingsModal" hidden>
    <div class="modal-box">
      <button type="button" class="card-close" id="settingsX" data-t-aria="close" data-t-title="close" aria-label="Закрыть" title="Закрыть">×</button>
      <h1 data-t="settings">Настройки</h1>
      <p class="section-title" data-t="cardFieldsTitle">Карточка страны</p>
      <div class="options" id="cardOptions">
        <label><input type="checkbox" data-field="flag"> <span data-t="flag">Флаг</span></label>
        <label><input type="checkbox" data-field="arms"> <span data-t="arms">Герб</span></label>
        <label><input type="checkbox" data-field="capital"> <span data-t="capital">Столица</span></label>
        <label><input type="checkbox" data-field="population"> <span data-t="population">Население</span></label>
        <label><input type="checkbox" data-field="area"> <span data-t="area">Площадь</span></label>
        <label><input type="checkbox" data-field="gdp"> <span data-t="gdp">ВВП по ППС</span></label>
        <label><input type="checkbox" data-field="currency"> <span data-t="currency">Валюта</span></label>
        <label><input type="checkbox" data-field="language"> <span data-t="languages">Языки</span></label>
      </div>
      <p class="section-title" data-t="mapOptionsTitle">Карта</p>
      <div class="options single">
        <label><input type="checkbox" data-field="greyRings"> <span data-t="greyRingsOption">Отмечать территории с особым статусом</span></label>
      </div>
      <button type="button" class="primary big" id="settingsClose" data-t="done">Готово</button>
    </div>
  </div>

  <footer class="credits" data-t="credits">
    Карта: Natural Earth. Сведения: Wikidata, Всемирный банк. Флаги и гербы: Wikimedia Commons.
  </footer>

  <script src="data/data.js?v=10"></script>
  <script src="i18n.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
